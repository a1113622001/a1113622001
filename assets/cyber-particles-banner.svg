<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141e30" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0a0e17" stop-opacity="1"/>
      <stop offset="100%" stop-color="#03070d" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="neonTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>

    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 0.9; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -600; }
    }
    @keyframes shimmerTitle {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.6)); }
      50% { filter: drop-shadow(0 0 25px rgba(0, 255, 136, 0.9)); }
    }
    .p1 { animation: floatParticle 6s ease-in-out infinite; transform-origin: center; }
    .p2 { animation: floatParticle 8s ease-in-out 1s infinite; transform-origin: center; }
    .p3 { animation: floatParticle 10s ease-in-out 2s infinite; transform-origin: center; }
    .p4 { animation: floatParticle 7s ease-in-out 3s infinite; transform-origin: center; }
    .p5 { animation: floatParticle 9s ease-in-out 1.5s infinite; transform-origin: center; }
    .orb { animation: pulseOrb 4s ease-in-out infinite; transform-origin: center; }
    .ring { animation: rotateRing 20s linear infinite; transform-origin: center; }
    .ring-rev { animation: rotateRing 15s linear reverse infinite; transform-origin: center; }
    .wave-line { stroke-dasharray: 12 8; animation: waveDash 18s linear infinite; }
    .main-title { animation: shimmerTitle 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="280" rx="16" fill="url(#bgGlow)"/>
  <rect width="898" height="278" x="1" y="1" rx="15" fill="none" stroke="url(#neonTextGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Cyber Grid Matrix Lines -->
  <g stroke="#00f2fe" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="250" y1="0" x2="250" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="650" y1="0" x2="650" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
  </g>

  <!-- Quantum Laser Wave Streams -->
  <path d="M 0,140 Q 225,50 450,140 T 900,140" fill="none" stroke="url(#neonTextGrad)" stroke-width="2" stroke-opacity="0.35" class="wave-line"/>
  <path d="M 0,140 Q 225,230 450,140 T 900,140" fill="none" stroke="url(#purplePinkGrad)" stroke-width="1.5" stroke-opacity="0.3" class="wave-line" style="animation-duration: 24s;"/>

  <!-- Left Orbital Holographic Ring -->
  <g transform="translate(140, 140)">
    <circle r="60" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.3" class="ring"/>
    <circle r="40" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="10 8" stroke-opacity="0.4" class="ring-rev"/>
    <circle r="6" fill="#00FF88" filter="url(#glow)" class="orb"/>
  </g>

  <!-- Right Orbital Holographic Ring -->
  <g transform="translate(760, 140)">
    <circle r="60" fill="none" stroke="#FF0080" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.3" class="ring-rev"/>
    <circle r="40" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4" class="ring"/>
    <circle r="6" fill="#00F2FE" filter="url(#glow)" class="orb"/>
  </g>

  <!-- Dynamic Glowing Quantum Particles (25+ Particles) -->
  <!-- Layer 1 (Cyan) -->
  <circle cx="80" cy="60" r="3.5" fill="#00F2FE" filter="url(#glow)" class="p1"/>
  <circle cx="220" cy="40" r="2.5" fill="#00F2FE" filter="url(#glow)" class="p2"/>
  <circle cx="340" cy="70" r="4" fill="#00FF88" filter="url(#glow)" class="p3"/>
  <circle cx="560" cy="50" r="3" fill="#00F2FE" filter="url(#glow)" class="p4"/>
  <circle cx="680" cy="80" r="4.5" fill="#00FF88" filter="url(#glow)" class="p5"/>
  <circle cx="820" cy="50" r="3" fill="#00F2FE" filter="url(#glow)" class="p1"/>

  <!-- Layer 2 (Purple/Magenta) -->
  <circle cx="120" cy="220" r="4" fill="#FF0080" filter="url(#glow)" class="p3"/>
  <circle cx="280" cy="240" r="3" fill="#7928CA" filter="url(#glow)" class="p4"/>
  <circle cx="480" cy="230" r="4.5" fill="#FF0080" filter="url(#glow)" class="p5"/>
  <circle cx="620" cy="210" r="3" fill="#7928CA" filter="url(#glow)" class="p1"/>
  <circle cx="780" cy="230" r="4" fill="#FF0080" filter="url(#glow)" class="p2"/>

  <!-- Layer 3 (Mid-field Sparks) -->
  <circle cx="180" cy="110" r="2" fill="#00FF88" class="p5"/>
  <circle cx="270" cy="170" r="2" fill="#00F2FE" class="p2"/>
  <circle cx="630" cy="160" r="2.5" fill="#00F2FE" class="p4"/>
  <circle cx="710" cy="110" r="2" fill="#00FF88" class="p3"/>

  <!-- Central Title Backlight Glow -->
  <ellipse cx="450" cy="130" rx="260" ry="55" fill="#00F2FE" fill-opacity="0.08" filter="url(#softGlow)" class="orb"/>

  <!-- Central Typography -->
  <g class="main-title" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Top Cyber Tag -->
    <text x="450" y="82" font-size="12" font-weight="700" fill="#00FF88" letter-spacing="6" opacity="0.95">✦ QUANTUM INTELLIGENCE ARCHITECT ✦</text>

    <!-- Main Operative Name -->
    <text x="450" y="142" font-size="44" font-weight="900" fill="url(#neonTextGrad)" letter-spacing="4">BAIYE · 白夜</text>

    <!-- Subtitle Description -->
    <text x="450" y="186" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="2">AI AGENT &amp; MCP PROTOCOL  |  OFFLINE RAG  |  DEEPSEEK ECOSYSTEM</text>
  </g>

  <!-- Bottom Interactive Quantum Status Bar Inside Banner -->
  <g transform="translate(230, 222)">
    <rect width="440" height="26" rx="13" fill="#000000" fill-opacity="0.5" stroke="url(#neonTextGrad)" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="13" r="4" fill="#00FF88" filter="url(#glow)" class="orb"/>
    <text x="35" y="17" font-family="'Fira Code', monospace, sans-serif" font-size="11" font-weight="600" fill="#00F2FE">NEURAL LINK: ONLINE</text>
    <text x="195" y="17" font-family="'Fira Code', monospace, sans-serif" font-size="11" font-weight="600" fill="#7928CA">│</text>
    <text x="215" y="17" font-family="'Fira Code', monospace, sans-serif" font-size="11" font-weight="600" fill="#00FF88">4,456 WIKI RAG: ACTIVE</text>
  </g>
</svg>